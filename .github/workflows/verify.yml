name: verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  resilient-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test labs/resilient-reader/reader.test.mjs labs/resilient-reader/jobs.test.mjs
      - run: node labs/resilient-reader/demo.mjs
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: dotnet run --project labs/modular-jobs/Checks -c Release
      - run: node labs/resilient-reader/jobs.integration.mjs
      - name: Compile infrastructure without deployment
        run: az bicep build --file infra/storage.bicep --outfile /tmp/storage.json
